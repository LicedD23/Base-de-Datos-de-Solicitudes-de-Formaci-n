<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña Restablecida - SENA</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root{
            --sena-green:#009640;
            --sena-dark:#004d26;
            --sena-light:#00b050;
        }
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body{
            font-family:'Poppins',sans-serif;
            background:linear-gradient(135deg, #e8f5e9 0%, #f0f8f4 50%, #e0f2f1 100%);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }
        .success-container{
            background:rgba(255,255,255,0.98);
            max-width:540px;
            padding:50px 40px;
            border-radius:24px;
            box-shadow:0 20px 60px rgba(0,150,64,0.15);
            text-align:center;
            animation:fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }
        .success-icon{
            width:120px;
            height:120px;
            margin:0 auto 25px;
            background:linear-gradient(135deg,#4CAF50, #66BB6A);
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:4rem;
            color:white;
            box-shadow:0 15px 40px rgba(76,175,80,0.4);
            animation:successPulse 1.5s ease infinite;
        }
        @keyframes successPulse{
            0%,100%{
                transform:scale(1);
            }
            50%{
                transform:scale(1.05)
            }
        }
        .title{
            font-size:32px;
            font-weight:700;
            color:var(--sena-dark);
            margin-bottom:15px;
        }
        .message{
            color:#666;
            font-size:16px;
            line-height:1.8;
            margin-bottom:35px;
        }
        .btn{
            display:inline-block;
            background:linear-gradient(135deg, var(--sena-green),var(--sena-light));
            color:white;
            padding:16px 45px;
            border-radius:12px;
            text-decoration:none;
            font-weight:700;
            font-size:16px;
            transition:all 0.3s ease;
            box-shadow:0 8px 20px rgba(0,150,64,0.3);
            text-transform:uppercase;
        }
        .btn:hover{
            background:linear-gradient(135deg,var(--sena-dark),var(--sena-green));
            transform:translateY(-2px);
            box-shadow:0 12px 30px rgba(0,150,64,0.4);
            color:white;
        }
        .confetti{
            position:absolute;
            width:10px;
            height:10px;
            background:var(--sena-green);
            animation:fall 3s linear infinite;
        }
        @keyframes fall{
            to{
                transform:translateY(100vh) rotate(360deg);
                opacity:0;
            }
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">
            <i class="bi bi-check-circle-fill"></i>
        </div>
        <h2 class="title">¡Contraseña Restablecida!</h2>
        <p class="message">
            Tu contraseña ha sido actualizada exitosamente.
            <br><br>
            Ahora puedes iniciar sesion con tu  nueva contraseña.
        </p>
        <a href="{%url 'core:login'%}" class="btn">
            <i class="bi bi-box-arrow-in-right me-2"></i>
            Iniciar sesion
        </a>
    </div>
    {% include 'core/accessibility.html'%}
</body>
</html>
