    function closePanel() {
        if (!panel || !overlay) return;
        panel.classList.remove('active');
        overlay.classList.remove('active');
    }
    function togglePanel() {
        if (!panel) return;
        if (panel.classList.contains('active')) closePanel();
        else openPanel();
    }

    function applyLanguage(lang) {
        if (!translations[lang]) return;

        preferredLanguage = lang;
        localStorage.setItem('preferredLanguage', lang);

        // 1) Traduce elementos con data-translate
        document.querySelectorAll('[data-translate]').forEach(el => {
            const key = el.getAttribute('data-translate');
            if (key && translations[lang][key]) {
                el.textContent = translations[lang][key];
            }
        });

        // 2) Heurística: reemplazar textos EXACTOS en nodos de texto
        // Construir mapa de textoOriginal(es) => key
        const esMap = {};
        Object.keys(translations.es).forEach(k => {
            const esText = translations.es[k];
            if (typeof esText === 'string' && esText.trim().length > 0) {
                esMap[esText.trim()] = k;
            }
        });

        // Recorre nodos de texto (excluye script, style, textarea, input)
        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
            acceptNode: function(node) {
                if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
                const parentTag = node.parentElement && node.parentElement.tagName.toLowerCase();
                if (['script','style','textarea','input'].includes(parentTag)) return NodeFilter.FILTER_REJECT;
                return NodeFilter.FILTER_ACCEPT;
            }
        });

        const nodesToReplace = [];
        while (walker.nextNode()) {
            nodesToReplace.push(walker.currentNode);
        }

        nodesToReplace.forEach(textNode => {
            const original = textNode.nodeValue.trim();
            // Si el texto coincide EXACTAMENTE con alguna cadena en español registrada, reemplazar
            const key = esMap[original];
            if (key && translations[lang][key]) {
                // Mantener espacios alrededor originales (si existían)
                const prefix = textNode.nodeValue.match(/^\s*/)[0] || '';
                const suffix = textNode.nodeValue.match(/\s*$/)[0] || '';
                textNode.nodeValue = prefix + translations[lang][key] + suffix;
            }
        });

        // 3) Traduce atributos placeholder/title/alt/value si coinciden con texto en español
        const attrList = ['placeholder','title','alt','value'];
        attrList.forEach(attr => {
            document.querySelectorAll('['+attr+']').forEach(el => {
                const val = el.getAttribute(attr);
                if (!val) return;
                const key = esMap[val.trim()];
                if (key && translations[lang][key]) el.setAttribute(attr, translations[lang][key]);
            });
        });

        // 4) Cambiar atributo lang del html
        document.documentElement.lang = lang;

        showNotification((lang === 'es' ? 'Español' : lang.toUpperCase()) + ' aplicado ✓');
    }

    // ---------- Botón aplicar idioma (permite mantener el comportamiento anterior) ----------
    if (applyLangBtn) applyLangBtn.addEventListener('click', () => {
        const lang = langSelect ? langSelect.value || 'es' : 'es';
        applyLanguage(lang);
    });

    // También aplica al cambiar el select directamente
    if (langSelect) langSelect.addEventListener('change', (e) => {
        applyLanguage(e.target.value);
    });

    // ---------- Tamaño de texto global (aplica a <html>) ----------
    function setFontSize(size) {
        accessibilityFontSize = Math.max(10, Math.min(30, size));
        document.documentElement.style.fontSize = accessibilityFontSize + 'px';
        localStorage.setItem('accessibilityFontSize', accessibilityFontSize);
        showNotification('Tamaño de texto: ' + accessibilityFontSize + 'px');
    }

    if (increaseBtn) increaseBtn.addEventListener('click', () => setFontSize(accessibilityFontSize + 2));
    if (decreaseBtn) decreaseBtn.addEventListener('click', () => setFontSize(accessibilityFontSize - 2));
    if (resetBtn) resetBtn.addEventListener('click', () => setFontSize(16));

    // ---------- Contraste ----------
    if (enableContrastBtn) enableContrastBtn.addEventListener('click', () => {
        document.body.classList.add('high-contrast');
        accessibilityHighContrast = true;
        localStorage.setItem('accessibilityHighContrast', 'true');
        showNotification('✓ Contraste alto activado');
    });
    if (disableContrastBtn) disableContrastBtn.addEventListener('click', () => {
        document.body.classList.remove('high-contrast');
        accessibilityHighContrast = false;
        localStorage.setItem('accessibilityHighContrast', 'false');
        showNotification('✓ Contraste normal restaurado');
    });

    // ---------- Lector de voz ----------
    const speech = window.speechSynthesis;
    let utterance = null;

    if (readBtn) readBtn.addEventListener('click', () => {
        if (speech.speaking) {
            showNotification('Ya hay una lectura en curso', 'warning');
            return;
        }
        const mainText = document.body.innerText;
        utterance = new SpeechSynthesisUtterance(mainText);
        // intenta voz según idioma seleccionado
        const lang = localStorage.getItem('preferredLanguage') || 'es';
        utterance.lang = (lang === 'es') ? 'es-ES' : (lang + '-' + lang.toUpperCase());

        const voices = speech.getVoices();
        const v = voices.find(voice => voice.lang && voice.lang.startsWith((utterance.lang || '').slice(0,2)));
        if (v) utterance.voice = v;

        utterance.rate = 0.95;
        utterance.onstart = () => showNotification('🔊 Iniciando lectura...');
        utterance.onend = () => showNotification('Lectura completada');
        utterance.onerror = () => showNotification('Error en la lectura', 'warning');

        speech.speak(utterance);
    });

    if (stopReadBtn) stopReadBtn.addEventListener('click', () => {
        if (speech.speaking) {
            speech.cancel();
            showNotification('Lectura detenida');
        } else {
            showNotification('No hay lectura activa', 'warning');
        }
    });

    // ---------- Guardar antes de salir ----------
    window.addEventListener('beforeunload', () => {
        localStorage.setItem('accessibilityFontSize', accessibilityFontSize);
        localStorage.setItem('accessibilityHighContrast', accessibilityHighContrast);
        localStorage.setItem('preferredLanguage', preferredLanguage);
    });

    // ---------- Al cargar la página, restaura todo ----------
    window.addEventListener('load', () => {
        // tamaño
        document.documentElement.style.fontSize = accessibilityFontSize + 'px';
        // contraste
        if (accessibilityHighContrast) document.body.classList.add('high-contrast');
        // idioma
        applyLanguage(preferredLanguage);
    });

    // Si las voces cambian en el navegador
    if (speech.onvoiceschanged !== undefined) {
        speech.onvoiceschanged = () => speech.getVoices();
    }
})(); // fin IIFE
</script>
