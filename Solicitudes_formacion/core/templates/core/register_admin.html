<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Administrador - SENA</title>

    <!-- Fuentes y estilos -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --sena-green: #009640;
            --sena-dark: #004d26;
            --sena-light: #00b050;
            --danger: #c62828;
            --success: #2e7d32;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #f0f8f4, #e0f2f1);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(0,150,64,0.07) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0,77,38,0.07) 0%, transparent 50%);
            z-index: 0;
        }

        .register-container {
            background: rgba(255, 255, 255, 0.98);
            padding: 40px 35px;
            border-radius: 24px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0px 15px 45px rgba(0, 150, 64, 0.2);
            position: relative;
            z-index: 2;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, var(--sena-green), var(--sena-light));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            color: white;
            font-size: 2.3rem;
            box-shadow: 0px 10px 25px rgba(0,150,64,0.3);
            animation: floating 3s infinite ease-in-out;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-7px); }
        }

        .title {
            font-size: 26px;
            font-weight: bold;
            color: var(--sena-dark);
        }

        .subtitle {
            font-size: 14px;
            color: #555;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 6px;
            color: #333;
            display: block;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i.left-icon {
            position: absolute;
            top: 50%;
            left: 14px;
            transform: translateY(-50%);
            color: #999;
            font-size: 1.15rem;
            pointer-events: none;
        }

        /* Icono de ojo para mostrar/ocultar contraseña */
        .toggle-password {
            position: absolute;
            top: 50%;
            right: 14px;
            transform: translateY(-50%);
            color: #666;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.3s;
            z-index: 10;
        }

        .toggle-password:hover {
            color: var(--sena-green);
        }

        input {
            width: 100%;
            padding: 13px 44px 13px 44px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: .3s;
        }

        input.no-icon-left {
            padding-left: 14px;
        }

        input:focus {
            border-color: var(--sena-green);
            box-shadow: 0 0 0 4px rgba(0,150,64,0.15);
        }

        .form-check {
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-check-input {
            accent-color: var(--sena-green);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .form-check-label {
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
        }

        button.btn {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            background: linear-gradient(135deg, var(--sena-green), var(--sena-light));
            cursor: pointer;
            box-shadow: 0px 10px 20px rgba(0,150,64,0.35);
            transition: 0.3s;
            text-transform: uppercase;
        }

        button.btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, var(--sena-dark), var(--sena-green));
        }

        /* Mensajes Django */
        .message-box {
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            animation: fadeInMessage .4s ease;
        }

        @keyframes fadeInMessage {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .error-message {
            background: #ffebee;
            border-left: 4px solid var(--danger);
            color: var(--danger);
        }

        .success-message {
            background: #e8f5e9;
            border-left: 4px solid var(--success);
            color: var(--success);
        }

        .footer-text {
            margin-top: 22px;
            text-align: center;
            font-size: 13px;
            color: #777;
        }

        .footer-text a {
            color: var(--sena-green);
            font-weight: bold;
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-text a:hover {
            color: var(--sena-dark);
        }
    </style>
</head>

<body>

    <div class="register-container">

        <!-- Logo -->
        <div class="logo-container">
            <div class="logo-icon"><i class="bi bi-person-gear"></i></div>
            <h2 class="title">Crear Administrador</h2>
            <p class="subtitle">Registrar un nuevo usuario administrador del sistema</p>
        </div>

        <!-- Mensajes -->
        {% if messages %}
            {% for message in messages %}
                <div class="message-box {% if message.tags == 'error' %}error-message{% else %}success-message{% endif %}">
                    <i class="bi {% if message.tags == 'error' %}bi-exclamation-circle-fill{% else %}bi-check-circle-fill{% endif %}"></i>
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- FORMULARIO -->
        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Usuario</label>
                <div class="input-wrapper">
                    <i class="bi bi-person-badge left-icon"></i>
                    <input type="text" name="username" placeholder="Ej: admin_sena" required>
                </div>
            </div>

            <div class="form-group">
                <label>Correo Electrónico</label>
                <div class="input-wrapper">
                    <i class="bi bi-envelope left-icon"></i>
                    <input type="email" name="email" placeholder="correo@ejemplo.com" required>
                </div>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" class="no-icon-left" placeholder="Mínimo 8 caracteres" required minlength="8">
                    <i class="bi bi-eye-slash toggle-password" onclick="togglePassword('password', this)"></i>
                </div>
            </div>

            <div class="form-group">
                <label>Confirmar Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="password2" name="password2" class="no-icon-left" placeholder="Repite la contraseña" required minlength="8">
                    <i class="bi bi-eye-slash toggle-password" onclick="togglePassword('password2', this)"></i>
                </div>
            </div>

            <div class="form-check">
                <input type="checkbox" name="is_superuser" class="form-check-input" id="isSuper">
                <label for="isSuper" class="form-check-label">Conceder permisos de Superusuario</label>
            </div>

            <button class="btn" type="submit">
                Crear Administrador
            </button>
        </form>

        <p class="footer-text">
            ¿Regresar?
            <a href="{% url 'core:dashboard' %}">Volver al Dashboard</a>
        </p>
    </div>

    <script>
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            
            if (input.type === 'password') {
                // Mostrar contraseña
                input.type = 'text';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            } else {
                // Ocultar contraseña
                input.type = 'password';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            }
        }
    </script>

</body>
</html>
